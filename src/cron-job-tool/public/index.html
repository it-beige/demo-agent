<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cron Job Tool · 智能定时任务测试平台</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-light: #64748b;
      --border: #e2e8f0;
      --muted-bg: #f8fafc;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, .1), 0 2px 4px -1px rgba(0, 0, 0, .06);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, .12), 0 8px 10px -6px rgba(0, 0, 0, .06);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 24px 16px 48px;
      color: var(--text);
    }

    .container {
      max-width: 1320px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      color: #fff;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, .15);
    }

    .header p {
      font-size: 1rem;
      opacity: .9;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width:1024px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 22px 24px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 20px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--border);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hint {
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      color: #3730a3;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .hint code {
      background: #e0e7ff;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color .2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    textarea {
      resize: vertical;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: filter .15s, transform .15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      filter: brightness(.95);
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-success {
      background: var(--success);
      color: #fff;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-warning {
      background: var(--warning);
      color: #fff;
    }

    .btn-ghost {
      background: var(--muted-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-sm {
      padding: 5px 12px;
      font-size: 12px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .response-box {
      background: var(--muted-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      margin-top: 14px;
      max-height: 320px;
      overflow-y: auto;
      font-family: ui-monospace, 'SF Mono', Consolas, monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .response-box.error {
      background: #fef2f2;
      border-color: #fecaca;
      color: #991b1b;
    }

    .response-box.success {
      background: #f0fdf4;
      border-color: #bbf7d0;
      color: #065f46;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th,
    td {
      padding: 11px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      background: var(--muted-bg);
      font-weight: 600;
      color: var(--text-light);
      font-size: 13px;
    }

    tbody tr:hover {
      background: var(--muted-bg);
    }

    .mono {
      font-family: ui-monospace, 'SF Mono', Consolas, monospace;
      font-size: 12px;
      color: var(--text-light);
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-success {
      background: #d1fae5;
      color: #065f46;
    }

    .badge-danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge-warning {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-info {
      background: #dbeafe;
      color: #1e40af;
    }

    .badge-muted {
      background: #f1f5f9;
      color: #64748b;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }

    .dot-on {
      background: var(--success);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, .2);
    }

    .dot-off {
      background: #cbd5e1;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(99, 102, 241, .3);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
    }

    .tab {
      padding: 8px 16px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-light);
      border-radius: 8px;
    }

    .tab:hover {
      background: var(--muted-bg);
    }

    .tab.active {
      background: var(--primary);
      color: #fff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .action-card {
      background: var(--muted-bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }

    .action-card:hover {
      border-color: var(--primary);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .action-card h4 {
      margin-bottom: 4px;
      color: var(--primary);
      font-size: 15px;
    }

    .action-card p {
      font-size: 12.5px;
      color: var(--text-light);
    }

    .empty {
      padding: 28px;
      text-align: center;
      color: var(--text-light);
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-light);
      cursor: pointer;
      user-select: none;
    }

    .switch input {
      width: auto;
    }

    /* Toast */
    #toast-wrap {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      min-width: 220px;
      max-width: 380px;
      padding: 12px 16px;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      box-shadow: var(--shadow-lg);
      animation: slidein .25s ease;
    }

    .toast.info {
      background: #334155;
    }

    .toast.success {
      background: var(--success);
    }

    .toast.error {
      background: var(--danger);
    }

    @keyframes slidein {
      from {
        transform: translateX(30px);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div id="toast-wrap"></div>
  <div class="container">
    <div class="header">
      <h1>🤖 Cron Job Tool</h1>
      <p>基于 NestJS + LangChain 的自然语言定时任务管理系统</p>
    </div>

    <!-- 快捷操作 -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title"><span>⚡</span> 快捷操作</h2>
      </div>
      <div class="hint">
        💡 定时任务只有<strong>说明了送达方式</strong>才能真正通知到你。系统目前唯一的对外通道是<strong>邮件</strong>，
        所以「提醒喝水」这类指令必须带上收件人，例如：<code>1 分钟后发邮件到 it_beige@163.com 提醒我喝水</code>。
        只写「提醒我喝水」时任务会照常触发，但没有收件人可送达，你不会收到任何东西。
      </div>
      <div class="quick-actions" id="quickActions"></div>
    </div>

    <div class="grid">
      <!-- AI 对话 -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title"><span>💬</span> AI 对话测试</h2>
        </div>
        <div class="form-group">
          <label for="aiQuery">输入自然语言指令</label>
          <textarea id="aiQuery" rows="4"
            placeholder="例如：1 分钟后发邮件到 lisi@example.com 提醒我开会"></textarea>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="btnSend" onclick="sendAI(false)"><span>🚀</span> 发送</button>
          <button class="btn btn-success" id="btnStream" onclick="sendAI(true)"><span>📡</span> 流式发送</button>
          <button class="btn btn-ghost" onclick="clearAI()">清空</button>
        </div>
        <div id="aiResponse" class="response-box" style="display:none"></div>
      </div>

      <!-- 用户管理 -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title"><span>👥</span> 用户管理</h2>
        </div>
        <div class="tabs">
          <button class="tab active" onclick="switchTab(this,'userForm')">新增用户</button>
          <button class="tab" onclick="switchTab(this,'userList')">用户列表</button>
        </div>

        <div id="userForm" class="tab-content active">
          <div class="form-group">
            <label>姓名</label>
            <input type="text" id="userName" placeholder="输入姓名" />
          </div>
          <div class="form-group">
            <label>邮箱</label>
            <input type="email" id="userEmail" placeholder="输入邮箱" />
          </div>
          <div class="form-group">
            <label>角色</label>
            <select id="userRole">
              <option value="user">user</option>
              <option value="admin">admin</option>
              <option value="manager">manager</option>
              <option value="owner">owner</option>
            </select>
          </div>
          <div class="btn-group">
            <button class="btn btn-primary" onclick="createUser()"><span>➕</span> 创建用户</button>
            <button class="btn btn-ghost" onclick="loadUsers()"><span>🔄</span> 刷新</button>
          </div>
        </div>

        <div id="userList" class="tab-content">
          <div class="table-wrap" id="userTableContainer"></div>
        </div>
      </div>
    </div>

    <!-- 定时任务管理 -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title"><span>📅</span> 定时任务管理</h2>
        <div class="toolbar">
          <label class="switch">
            <input type="checkbox" id="autoRefresh" onchange="toggleAutoRefresh()" />
            自动刷新(5s)
          </label>
          <button class="btn btn-ghost btn-sm" onclick="loadJobs()"><span>🔄</span> 刷新</button>
        </div>
      </div>
      <div class="table-wrap" id="jobTableContainer"></div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    /* ---------------- 通用工具 ---------------- */
    function escapeHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function fmtTime(v) {
      if (!v) return '—';
      const d = new Date(v);
      if (isNaN(d.getTime())) return escapeHtml(v);
      return d.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false });
    }

    function toast(msg, type = 'info', timeout = 3000) {
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.textContent = msg;
      document.getElementById('toast-wrap').appendChild(el);
      setTimeout(() => el.remove(), timeout);
    }

    async function api(path, options = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = text; }
      if (!res.ok) {
        const detail = data && data.message ? data.message : res.statusText;
        throw new Error(`${res.status} ${detail}`);
      }
      return data;
    }

    function switchTab(btn, id) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(id).classList.add('active');
    }

    /* ---------------- 快捷操作 ---------------- */
    const QUICK_ACTIONS = [
      { icon: '👤', title: '创建用户', desc: '创建测试用户张三', q: '创建一个新用户，姓名张三，邮箱 zhangsan@example.com，角色 admin' },
      { icon: '📋', title: '查看用户', desc: '让 AI 列出所有用户', q: '列出所有用户' },
      { icon: '📧', title: '一次性邮件提醒', desc: '1 分钟后发提醒邮件', q: '1 分钟后发邮件到 it_beige@163.com 提醒我喝水' },
      { icon: '🔁', title: '周期任务', desc: '每 2 分钟发一次', q: '每 2 分钟发邮件到 it_beige@163.com 汇报一句今日励志语' },
      { icon: '🔍', title: 'Web 搜索', desc: '搜索最新资讯', q: '搜索 2026 年最新的 AI 模型并总结要点' },
      { icon: '📨', title: '直接发邮件', desc: '测试邮件功能', q: '发一封测试邮件到 it_beige@163.com，主题是测试邮件，内容用 Markdown 写一段问候' },
    ];

    function renderQuickActions() {
      document.getElementById('quickActions').innerHTML = QUICK_ACTIONS.map((a, i) => `
        <div class="action-card" data-idx="${i}">
          <h4>${a.icon} ${escapeHtml(a.title)}</h4>
          <p>${escapeHtml(a.desc)}</p>
        </div>`).join('');
      document.querySelectorAll('.action-card').forEach(card => {
        card.addEventListener('click', () => {
          const a = QUICK_ACTIONS[card.dataset.idx];
          document.getElementById('aiQuery').value = a.q;
          sendAI(false);
        });
      });
    }

    /* ---------------- AI 对话 ---------------- */
    function setBusy(busy) {
      document.getElementById('btnSend').disabled = busy;
      document.getElementById('btnStream').disabled = busy;
    }

    function clearAI() {
      document.getElementById('aiQuery').value = '';
      const box = document.getElementById('aiResponse');
      box.style.display = 'none';
      box.textContent = '';
    }

    async function sendAI(stream) {
      const query = document.getElementById('aiQuery').value.trim();
      if (!query) { toast('请输入指令', 'error'); return; }

      const box = document.getElementById('aiResponse');
      box.style.display = 'block';
      box.className = 'response-box';
      box.innerHTML = `<span class="spinner"></span> ${stream ? '正在接收流式数据…' : '正在处理…'}`;
      setBusy(true);

      try {
        if (stream) {
          await streamChat(query, box);
        } else {
          const data = await api(`/ai/chat?query=${encodeURIComponent(query)}`);
          box.className = 'response-box success';
          box.textContent = typeof data === 'string' ? data : (data.answer ?? JSON.stringify(data, null, 2));
        }
        // 指令大多会改动用户/任务，顺手刷新两张表
        loadUsers();
        loadJobs();
      } catch (err) {
        box.className = 'response-box error';
        box.textContent = `请求失败：${err.message}`;
        toast('请求失败：' + err.message, 'error');
      } finally {
        setBusy(false);
      }
    }

    // 解析 SSE：按事件(\n\n)分割，合并每个事件里的 data: 行，能正确处理跨 chunk 的半行
    async function streamChat(query, box) {
      const res = await fetch(`${API_BASE}/ai/chat/stream?query=${encodeURIComponent(query)}`);
      if (!res.ok || !res.body) throw new Error(`${res.status} ${res.statusText}`);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let full = '';

      const flushEvent = (raw) => {
        const dataLines = raw.split('\n')
          .filter(l => l.startsWith('data:'))
          .map(l => l.slice(l.startsWith('data: ') ? 6 : 5));
        if (dataLines.length) {
          full += dataLines.join('\n');
          box.textContent = full;
        }
      };

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf('\n\n')) !== -1) {
          flushEvent(buffer.slice(0, idx));
          buffer = buffer.slice(idx + 2);
        }
      }
      if (buffer.trim()) flushEvent(buffer);

      box.className = 'response-box success';
      if (!full) box.textContent = '(无文本输出，可能只执行了工具调用)';
    }

    /* ---------------- 用户管理（走确定性 REST） ---------------- */
    const ROLE_BADGE = {
      admin: 'badge-success', owner: 'badge-warning',
      manager: 'badge-info', user: 'badge-muted',
    };

    async function loadUsers() {
      const container = document.getElementById('userTableContainer');
      try {
        const users = await api('/api/users');
        if (!Array.isArray(users) || users.length === 0) {
          container.innerHTML = '<div class="empty">暂无用户数据</div>';
          return;
        }
        const rows = users.map(u => `
          <tr>
            <td>${u.id}</td>
            <td>${escapeHtml(u.name)}</td>
            <td>${escapeHtml(u.email)}</td>
            <td><span class="badge ${ROLE_BADGE[u.role] || 'badge-muted'}">${escapeHtml(u.role)}</span></td>
            <td class="mono">${fmtTime(u.createdAt)}</td>
            <td><button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})">删除</button></td>
          </tr>`).join('');
        container.innerHTML = `
          <table>
            <thead><tr><th>ID</th><th>姓名</th><th>邮箱</th><th>角色</th><th>创建时间</th><th>操作</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>`;
      } catch (err) {
        container.innerHTML = `<div class="empty" style="color:var(--danger)">加载失败：${escapeHtml(err.message)}</div>`;
      }
    }

    async function createUser() {
      const name = document.getElementById('userName').value.trim();
      const email = document.getElementById('userEmail').value.trim();
      const role = document.getElementById('userRole').value;
      if (!name || !email) { toast('请填写姓名和邮箱', 'error'); return; }

      try {
        await api('/api/users', { method: 'POST', body: JSON.stringify({ name, email, role }) });
        toast('用户已创建', 'success');
        document.getElementById('userName').value = '';
        document.getElementById('userEmail').value = '';
        switchTab(document.querySelectorAll('.tab')[1], 'userList');
        loadUsers();
      } catch (err) {
        toast('创建失败：' + err.message, 'error');
      }
    }

    async function deleteUser(id) {
      if (!confirm(`确定删除用户 ID ${id} 吗？`)) return;
      try {
        await api(`/api/users/${id}`, { method: 'DELETE' });
        toast('用户已删除', 'success');
        loadUsers();
      } catch (err) {
        toast('删除失败：' + err.message, 'error');
      }
    }

    /* ---------------- 定时任务管理 ---------------- */
    const TYPE_BADGE = { cron: 'badge-info', every: 'badge-warning', at: 'badge-success' };

    function humanizeEvery(ms) {
      if (!ms || ms <= 0) return '—';
      const s = Math.round(ms / 1000);
      if (s % 86400 === 0) return `每 ${s / 86400} 天`;
      if (s % 3600 === 0) return `每 ${s / 3600} 小时`;
      if (s % 60 === 0) return `每 ${s / 60} 分钟`;
      return `每 ${s} 秒`;
    }

    function scheduleText(job) {
      if (job.type === 'cron') return `<span class="mono">${escapeHtml(job.cron || '—')}</span>`;
      if (job.type === 'every') return humanizeEvery(job.everyMs);
      if (job.type === 'at') return `<span class="mono">${fmtTime(job.at)}</span>`;
      return '—';
    }

    async function loadJobs() {
      const container = document.getElementById('jobTableContainer');
      try {
        const data = await api('/api/jobs');
        const jobs = (data && data.jobs) || [];
        if (jobs.length === 0) {
          container.innerHTML = '<div class="empty">暂无定时任务</div>';
          return;
        }
        const rows = jobs.map(job => {
          const typeBadge = `<span class="badge ${TYPE_BADGE[job.type] || 'badge-muted'}">${escapeHtml(job.type)}</span>`;
          const statusBadge = job.isEnabled
            ? '<span class="badge badge-success">已启用</span>'
            : '<span class="badge badge-danger">已禁用</span>';
          const running = job.running
            ? '<span class="dot dot-on"></span>运行中'
            : '<span class="dot dot-off"></span>未运行';
          return `
            <tr>
              <td class="mono">${escapeHtml(String(job.id).slice(0, 8))}…</td>
              <td>${typeBadge}</td>
              <td>${escapeHtml(job.instruction)}</td>
              <td>${scheduleText(job)}</td>
              <td>${statusBadge}</td>
              <td>${running}</td>
              <td class="mono">${fmtTime(job.lastRun)}</td>
              <td class="mono">${fmtTime(job.createdAt)}</td>
              <td>
                <button class="btn btn-sm ${job.isEnabled ? 'btn-warning' : 'btn-success'}"
                  onclick="toggleJob('${job.id}', ${job.isEnabled})">
                  ${job.isEnabled ? '禁用' : '启用'}
                </button>
                <button class="btn btn-sm btn-danger" onclick="deleteJob('${job.id}')">删除</button>
              </td>
            </tr>`;
        }).join('');
        container.innerHTML = `
          <table>
            <thead><tr>
              <th>ID</th><th>类型</th><th>任务描述</th><th>调度</th>
              <th>状态</th><th>运行</th><th>上次执行</th><th>创建时间</th><th>操作</th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>`;
      } catch (err) {
        container.innerHTML = `<div class="empty" style="color:var(--danger)">加载失败：${escapeHtml(err.message)}</div>`;
      }
    }

    async function toggleJob(id, currentEnabled) {
      try {
        await api(`/api/jobs/${id}/toggle`, {
          method: 'POST',
          body: JSON.stringify({ isEnabled: !currentEnabled }),
        });
        toast(!currentEnabled ? '任务已启用' : '任务已禁用', 'success');
        loadJobs();
      } catch (err) {
        toast('操作失败：' + err.message, 'error');
      }
    }

    async function deleteJob(id) {
      if (!confirm('确定删除该定时任务吗？（会同时停止其定时器）')) return;
      try {
        await api(`/api/jobs/${id}`, { method: 'DELETE' });
        toast('任务已删除', 'success');
        loadJobs();
      } catch (err) {
        toast('删除失败：' + err.message, 'error');
      }
    }

    /* ---------------- 自动刷新 ---------------- */
    let autoTimer = null;
    function toggleAutoRefresh() {
      const on = document.getElementById('autoRefresh').checked;
      if (on) {
        autoTimer = setInterval(loadJobs, 5000);
        toast('已开启自动刷新', 'info', 1500);
      } else if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
      }
    }

    /* ---------------- 初始化 ---------------- */
    window.addEventListener('DOMContentLoaded', () => {
      renderQuickActions();
      loadUsers();
      loadJobs();
    });
  </script>
</body>

</html>
