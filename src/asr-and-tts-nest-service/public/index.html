<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSE Chat Stream 测试</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    
    .header p {
      opacity: 0.9;
      font-size: 14px;
    }
    
    .form-section {
      padding: 30px;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }
    
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .form-group textarea {
      min-height: 100px;
      resize: vertical;
      font-family: inherit;
    }
    
    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }
    
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn-stop {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      margin-top: 10px;
    }
    
    .response-section {
      padding: 30px;
    }
    
    .response-section h2 {
      font-size: 18px;
      color: #333;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ccc;
      display: inline-block;
    }
    
    .status-indicator.connecting {
      background: #f5a623;
      animation: pulse 1s infinite;
    }
    
    .status-indicator.connected {
      background: #7ed321;
    }
    
    .status-indicator.disconnected {
      background: #d0021b;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .response-container {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 20px;
      min-height: 200px;
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
    }
    
    .response-content {
      font-size: 14px;
      line-height: 1.8;
      color: #333;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .response-content:empty::before {
      content: '等待响应...';
      color: #999;
      font-style: italic;
    }
    
    .info-section {
      background: #f0f4ff;
      padding: 20px 30px;
      border-top: 1px solid #e0e0e0;
    }
    
    .info-section h3 {
      font-size: 14px;
      color: #667eea;
      margin-bottom: 10px;
    }
    
    .info-section ul {
      list-style: none;
      padding-left: 0;
    }
    
    .info-section li {
      font-size: 13px;
      color: #666;
      padding: 5px 0;
      padding-left: 20px;
      position: relative;
    }
    
    .info-section li::before {
      content: '•';
      color: #667eea;
      position: absolute;
      left: 0;
      font-weight: bold;
    }
    
    .info-section code {
      background: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      color: #764ba2;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🤖 SSE Chat Stream 测试</h1>
      <p>测试 NestJS AI 服务的流式响应功能</p>
    </div>
    
    <div class="form-section">
      <div class="form-group">
        <label for="query">问题内容</label>
        <textarea 
          id="query" 
          placeholder="请输入您的问题..."
        >Nest 工程师的职业要求</textarea>
      </div>
      
      <button class="btn" id="startBtn" onclick="startSSE()">
        🚀 开始流式请求
      </button>
      
      <button class="btn btn-stop" id="stopBtn" onclick="stopSSE()" disabled>
        ⏹️ 停止请求
      </button>
    </div>
    
    <div class="response-section">
      <h2>
        <span class="status-indicator" id="statusIndicator"></span>
        响应内容
      </h2>
      <div class="response-container">
        <div class="response-content" id="responseContent"></div>
      </div>
    </div>
    
    <div class="info-section">
      <h3>📋 接口信息</h3>
      <ul>
        <li>请求地址：<code>/ai/chat/stream?query={query}</code></li>
        <li>请求方式：<code>GET</code></li>
        <li>响应类型：<code>Server-Sent Events (SSE)</code></li>
        <li>数据格式：<code>{ data: string }</code></li>
      </ul>
    </div>
  </div>
  
  <script>
    let eventSource = null;
    
    function startSSE() {
      const query = document.getElementById('query').value.trim();
      
      if (!query) {
        alert('请输入问题内容！');
        return;
      }
      
      const responseContent = document.getElementById('responseContent');
      const statusIndicator = document.getElementById('statusIndicator');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      
      responseContent.textContent = '';
      statusIndicator.className = 'status-indicator connecting';
      startBtn.disabled = true;
      stopBtn.disabled = false;
      
      const url = `/ai/chat/stream?query=${encodeURIComponent(query)}`;
      
      eventSource = new EventSource(url);
      
      eventSource.onmessage = function(event) {
        responseContent.textContent += event.data;
        responseContent.scrollTop = responseContent.scrollHeight;
      };
      
      eventSource.onerror = function(error) {
        console.error('SSE Error:', error);
        statusIndicator.className = 'status-indicator disconnected';
        startBtn.disabled = false;
        stopBtn.disabled = true;
        eventSource.close();
        eventSource = null;
        
        if (responseContent.textContent === '') {
          responseContent.textContent = '❌ 连接失败，请检查服务是否正常运行';
        }
      };
      
      eventSource.onopen = function() {
        statusIndicator.className = 'status-indicator connected';
      };
    }
    
    function stopSSE() {
      if (eventSource) {
        eventSource.close();
        eventSource = null;
        
        const statusIndicator = document.getElementById('statusIndicator');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        
        statusIndicator.className = 'status-indicator disconnected';
        startBtn.disabled = false;
        stopBtn.disabled = true;
        
        const responseContent = document.getElementById('responseContent');
        responseContent.textContent += '\n\n⏹️ [请求已停止]';
      }
    }
  </script>
</body>
</html>
